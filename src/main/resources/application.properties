spring.application.name=FraktalBackend
spring.datasource.url=jdbc:postgresql://localhost:5432/fraktaldb
spring.datasource.username=postgres
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.main.allow-bean-definition-overriding=true
jwt.secret=fraktal-dev-secret-key-minimum-32-characters
jwt.expiration=3600000
app.frontend-url=http://127.0.0.1:5173
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173
